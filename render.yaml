services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: kaiveron-backend
    runtime: node
    region: singapore          # closest to India
    plan: free
    branch: main

    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # ── Database — injected from the Render PostgreSQL below ──────────────
      - key: DATABASE_URL
        fromDatabase:
          name: kaiveron-db
          property: connectionString

      # ── Secrets — set manually in Render dashboard ────────────────────────
      - key: JWT_ACCESS_SECRET
        sync: false            # you'll paste this in the dashboard
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JIKAN_BASE_URL
        value: https://api.jikan.moe/v4
      - key: CATALOG_PROVIDER
        value: jikan
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: false
      - key: CRON_SECRET
        sync: false            # set a strong random secret in Render dashboard

# ── PostgreSQL database ────────────────────────────────────────────────────
databases:
  - name: kaiveron-db
    databaseName: kaiveron
    region: singapore
    plan: free
