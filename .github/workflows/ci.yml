# Kaiveron backend — PR gate
#
# Runs typecheck + tests on every PR to main + on every push to main.
# Tests use a postgres service container so the DB-touching tests can run.
# Blocks merge if either step fails (configure branch protection in GitHub
# settings → branches → main → "Require status checks to pass").

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_ACCESS_SECRET:  test-access-secret-min-32-chars-long!
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!
      JWT_ACCESS_EXPIRY:  15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN:        http://localhost:3000
      FRONTEND_URL:       http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test
