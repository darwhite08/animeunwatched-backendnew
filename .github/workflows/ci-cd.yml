name: Backend CI — Test & Deploy via Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests run on every push/PR ─────────────────────────────────────────────
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: animeunwatched_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/animeunwatched_test
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!

  # ── Render deploys automatically when tests pass on main ───────────────────
  # No extra config needed — Render watches the main branch via render.yaml
  # Set RENDER_DEPLOY_HOOK in GitHub secrets for an explicit trigger (optional)
  deploy-notify:
    name: Notify Render Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy triggered:', d.get('id','OK'))"
