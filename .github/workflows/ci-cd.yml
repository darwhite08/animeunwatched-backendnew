name: Backend CI — Test & Deploy via AWS App Runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests run on every push/PR ─────────────────────────────────────────────
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: animeunwatched_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - name: Security audit (supply chain)
        run: npm audit --audit-level=high || echo "⚠️ High-severity vulnerabilities found — review before deploying"
      - run: npx tsc --noEmit
      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/animeunwatched_test
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!

  # ── AWS App Runner deploys automatically when tests pass on main ──────────
  # The App Runner service watches the main branch via its GitHub source
  # connection (configured in the AWS console; IaC mirror is apprunner.yaml).
  # No GitHub-side step is required for deploys; this job exists only as a
  # gate so that App Runner won't pull a SHA the tests haven't approved.
  deploy-gate:
    name: Tests passed — App Runner free to deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: echo "Tests passed on main — AWS App Runner will pull this SHA on its next watch tick."
